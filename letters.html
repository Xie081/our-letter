<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>所有信件</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="letter-page.css">
</head>
<body>

<div id="auth-section">
  <h2>请先登录</h2>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="password" placeholder="密码">
  <button id="btn-login">登录</button>
  <button id="btn-register">注册</button>
</div>

<div id="letter-section" style="display:none;">
  <div style="display:flex; gap:8px; margin-bottom:10px;">
    <button onclick="window.location.href='index.html'" style="flex:1;">返回写信</button>
    <button onclick="window.location.href='recycle.html'" style="flex:1;">回收站</button>
    <button id="btn-logout" style="flex:0.5; background:#b86b6b;">登出</button>
  </div>

  <div class="filter-btn-group">
  <button id="btn-filter-me">我发出的</button>
  <button id="btn-filter-other">我收到的</button>
  </div>

  <div id="letters-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
