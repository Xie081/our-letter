<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>回收站</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-section">
  <h2>请先登录</h2>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="password" placeholder="密码">
  <button onclick="login()">登录</button>
</div>

<div id="letter-section" style="display:none;">
  <button onclick="window.location.href='index.html'" style="width:100%;margin-bottom:10px;">
    返回写信
  </button>
  <button onclick="window.location.href='letters.html'" style="width:100%;margin-bottom:10px;">
    返回信件列表
  </button>

  <h2>回收站</h2>
  <div id="recycle-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
