<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f0eadd">
<title>回收站</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="recycle-page.css">
</head>
<body>
<button class="dark-toggle" id="darkToggle">🌙</button>

<div id="auth-section">
  <h2>请先登录</h2>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="password" placeholder="密码">
  <button id="btn-login">登录</button>
  <button id="btn-register">注册</button>
</div>

<div id="room-section" style="display:none;">
  <h2>输入暗号进入聊天室</h2>
  <p class="subtitle">同一串数字，就是我们两个人的房间</p>
  <input type="text" id="roomCode" inputmode="numeric" maxlength="20" placeholder="输入你们的数字暗号">
  <button id="btn-enter-room">进入聊天室</button>
</div>

<div id="letter-section" style="display:none;">
  <div class="room-bar">
    <span id="room-label"></span>
    <button id="btn-switch-room" class="btn-link">切换聊天室</button>
  </div>

  <div class="top-nav" style="display:flex; gap:8px; margin-bottom:10px;">
    <button onclick="window.location.href='index.html'" style="flex:1;">返回写信</button>
    <button onclick="window.location.href='letters.html'" style="flex:1;">返回信件列表</button>
  </div>

  <h2>回收站</h2>
  <div id="recycle-list"></div>
</div>

<nav class="bottom-nav" id="bottom-nav">
  <a href="index.html" class="bottom-nav-item" data-page="index"><span class="nav-icon">✍️</span>写信</a>
  <a href="letters.html" class="bottom-nav-item" data-page="letters"><span class="nav-icon">✉️</span>信件</a>
  <a href="recycle.html" class="bottom-nav-item" data-page="recycle"><span class="nav-icon">🗑️</span>回收站</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
