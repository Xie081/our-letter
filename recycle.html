<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>回收站</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="recycle-page.css">
</head>
<body>

<div id="auth-section">
  <h2>请先登录</h2>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="password" placeholder="密码">
  <button id="btn-login">登录</button>
  <button id="btn-register">注册</button>
</div>

<div id="letter-section" style="display:none;">
  <div style="display:flex; gap:8px; margin-bottom:10px;">
    <button onclick="window.location.href='index.html'" style="flex:1;">返回写信</button>
    <button onclick="window.location.href='letters.html'" style="flex:1;">返回信件列表</button>
  </div>

  <h2>回收站</h2>
  <div id="recycle-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
