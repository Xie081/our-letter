<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>写一封信</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-section">
  <h2>登录 / 注册</h2>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="password" placeholder="密码">
  <button onclick="login()">登录</button>
  <button onclick="register()">注册</button>
</div>

<div id="letter-section" style="display:none;">
  <button onclick="window.location.href='letters.html'" style="width:100%;margin-bottom:10px;">
    查看所有信件
  </button>
  <button onclick="window.location.href='recycle.html'" style="width:100%;margin-bottom:10px;background:#666;">
    进入回收站
  </button>

  <h2>写一封信</h2>

  <!-- 👇 👇 这里变成可输入的心情 👇 👇 -->
  <input 
    id="moodInput" 
    placeholder="输入今日心情（可选）" 
    style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"
  >
  <div id="moodShow"></div>
  <!-- 👆 👆 心情输入框 👆 👆 -->

  <!-- 信纸背景切换 -->
  <div class="paper-style">
    <select id="paperSelect">
      <option value="paper-white">纯白信纸</option>
      <option value="paper-pink">温柔浅粉</option>
      <option value="paper-nature">清新浅绿</option>
      <option value="paper-old">复古牛皮</option>
    </select>
  </div>

  <!-- 图片上传 -->
  <div class="upload-area">
    <input type="file" id="imageInput" accept="image/*" style="display:none;">
    <button onclick="document.getElementById('imageInput').click()">📷选择图片</button>
    <div id="imagePreview"></div>
  </div>

  <textarea id="content" placeholder="想说的话..."></textarea>
  <button onclick="sendLetter()">发送信件</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
