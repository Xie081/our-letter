<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>写一封信</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-section">
  <h2>登录 / 注册</h2>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="password" placeholder="密码">
  <button onclick="login()">登录</button>
  <button onclick="register()">注册</button>
</div>

<div id="letter-section" style="display:none;">
  <button onclick="window.location.href='letters.html'" style="width:100%;margin-bottom:10px;">
    查看所有信件
  </button>
  <button onclick="window.location.href='recycle.html'" style="width:100%;margin-bottom:10px;">
    进入回收站
  </button>

  <h2>写一封信</h2>

  <input id="moodInput" placeholder="今天是什么心情~">
  <div id="moodShow"></div>

  <div class="paper-style">
    <select id="paperSelect" onchange="previewPaper(this.value)">
  <option value="paper-white">纯白</option>
  <option value="paper-blue">蓝色星星</option>
  <option value="paper-green">绿色星星</option>
  <option value="paper-red">红色星星</option>
  <option value="paper-whiteimg">白色纹理</option>
  <option value="paper-yellow">黄色信纸</option>
    </select>
  </div>

  <div class="upload-area">
    <input type="file" id="imageInput" accept="image/*" style="display:none;">
    <button onclick="document.getElementById('imageInput').click()">📷选择图片</button>
    <div id="imagePreview"></div>
  </div>

  <textarea id="content" placeholder="今天想说点什么~"></textarea>
  <button onclick="sendLetter()">发送信件</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
