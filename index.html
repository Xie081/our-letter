<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f0eadd">
<title>写一封信</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<button class="dark-toggle" id="darkToggle">🌙</button>

<div id="auth-section">
  <h2>登录 / 注册</h2>
  <p class="subtitle">写给我们的信</p>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="password" placeholder="密码">
  <button id="btn-login">登录</button>
  <button id="btn-register">注册</button>
  <button id="btn-forgot" class="btn-link">忘记密码？</button>
  <div id="reset-pwd-section" style="display:none; margin-top:12px;">
    <input type="password" id="new-password" placeholder="输入新密码（至少6位）">
    <button id="btn-reset-pwd">重置密码</button>
  </div>
</div>

<div id="room-section" style="display:none;">
  <h2>输入暗号进入聊天室</h2>
  <p class="subtitle">同一串数字，就是我们两个人的房间</p>
  <input type="text" id="roomCode" inputmode="numeric" maxlength="20" placeholder="输入你们的数字暗号">
  <button id="btn-enter-room">进入聊天室</button>
</div>

<div id="letter-section" style="display:none;">
  <div class="room-bar">
    <span id="room-label"></span>
    <button id="btn-switch-room" class="btn-link">切换聊天室</button>
  </div>

  <div class="top-nav" style="display:flex; gap:8px; margin-bottom:10px;">
    <button onclick="window.location.href='letters.html'" style="flex:1;">查看所有信件</button>
    <button onclick="window.location.href='recycle.html'" style="flex:1;">进入回收站</button>
  </div>

  <h2>写一封信</h2>

  <div class="paper-picker" id="paperPicker">
    <button type="button" class="paper-swatch paper-white active" data-paper="paper-white"><span>纯白</span></button>
    <button type="button" class="paper-swatch paper-blue" data-paper="paper-blue"><span>蓝色星星</span></button>
    <button type="button" class="paper-swatch paper-green" data-paper="paper-green"><span>绿色星星</span></button>
    <button type="button" class="paper-swatch paper-red" data-paper="paper-red"><span>红色星星</span></button>
    <button type="button" class="paper-swatch paper-whiteimg" data-paper="paper-whiteimg"><span>白色纹理</span></button>
    <button type="button" class="paper-swatch paper-yellow" data-paper="paper-yellow"><span>黄色信纸</span></button>
  </div>

  <div class="upload-area">
    <input type="file" id="imageInput" accept="image/*" multiple style="display:none;">
    <button id="btn-upload-image">📷选择图片</button>
    <div id="imagePreview"></div>
  </div>

  <textarea id="content" placeholder="今天想说点什么~"></textarea>
  <button id="btn-send">发送信件</button>
</div>

<nav class="bottom-nav" id="bottom-nav">
  <a href="index.html" class="bottom-nav-item" data-page="index"><span class="nav-icon">✍️</span>写信</a>
  <a href="letters.html" class="bottom-nav-item" data-page="letters"><span class="nav-icon">✉️</span>信件</a>
  <a href="recycle.html" class="bottom-nav-item" data-page="recycle"><span class="nav-icon">🗑️</span>回收站</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
